databases:
  - name: chainlit-db
    databaseName: lc_db
    user: lc_user
    plan: free
    # password will be set in the Render dashboard

services:
  - type: web
    name: chainlit-datalayer
    plan: free
    env: node
    buildCommand: npm install
    startCommand: npx prisma migrate deploy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chainlit-db
          property: connectionString
      - key: POSTGRES_USER
        fromDatabase:
          name: chainlit-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: chainlit-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: chainlit-db
          property: databaseName
      # Add your S3 and other environment variables here as needed